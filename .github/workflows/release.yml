# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - uses: ./.github/actions/grafana
        with:
          policy_token: ${{ secrets.GRAFANA_POLICY_TOKEN }}
          attestation: true
          go-version: '1.26'
        id: build
      - name: Upload to Factry Portal
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.FACTRY_PORTAL_PRODUCT_UPDATES_JWT_TOKEN }}" \
            -F "productType=${{steps.build.outputs.plugin-id}}" \
            -F "product=grafana-datasource" \
            -F "os=any" \
            -F "arch=any" \
            -F "version=${{steps.build.outputs.plugin-version}}" \
            -F "binary=@${{ steps.build.outputs.archive }}" \
            -F "signature=$(cat ${{ steps.build.outputs.archive-sha1sum }})" \
            --url "${{vars.FACTRY_PORTAL_PRODUCT_UPDATES_URL }}"

  archbee-sync:
    name: Sync changelog to Archbee
    needs: release
    runs-on: ubuntu-latest
    env:
      ARCHBEE_REPO: factrylabs/archbee
      ARCHBEE_BRANCH: spaces/changelog
      DESTINATION_MARKDOWN: docs/factry_historian_datasource_for_grafana.md
      PRODUCT: Grafana datasource
      TAG: ${{ github.ref_name }}
      ARCHBEE_TOKEN: ${{ secrets.ARCHBEE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Extract changelog section
        run: |
          set -euo pipefail

          if [ -z "${ARCHBEE_TOKEN}" ]; then
            echo "ERROR: ARCHBEE_GITHUB_TOKEN secret is not set"
            exit 1
          fi

          awk -v tag="${TAG}" '
            $0 == "## " tag {capture=1; print; next}
            capture && /^## v/ {exit}
            capture {print}
          ' CHANGELOG.md | awk '
            {line[NR] = $0}
            END {
              last = NR
              while (last > 0 && line[last] ~ /^[[:space:]]*$/) last--
              for (i = 1; i <= last; i++) print line[i]
            }
          ' > changelog_section.md

          if [ ! -s changelog_section.md ]; then
            echo "ERROR: no '## ${TAG}' section found in CHANGELOG.md"
            exit 1
          fi

          # The Archbee page carries a release date per version; add one if the author did not.
          if ! grep -q '^released: ' changelog_section.md; then
            {
              head -n1 changelog_section.md
              echo ""
              echo "released: $(date -u +%d/%m/%Y)"
              tail -n +2 changelog_section.md
            } > changelog_section_dated.md
            mv changelog_section_dated.md changelog_section.md
          fi

          echo "Extracted changelog section:"
          cat changelog_section.md

      - name: Clone Archbee docs repo
        run: |
          set -euo pipefail
          git clone --branch "${ARCHBEE_BRANCH}" --single-branch \
            "https://${ARCHBEE_TOKEN}@github.com/${ARCHBEE_REPO}.git" archbee

      - name: Insert section above the newest version
        id: insert
        run: |
          set -euo pipefail
          DEST="archbee/${DESTINATION_MARKDOWN}"

          if grep -qx "## ${TAG}" "${DEST}"; then
            echo "${DESTINATION_MARKDOWN} already documents ${TAG}; nothing to sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          awk '
            /^## v/ && !inserted {
              while ((getline line < "changelog_section.md") > 0) print line
              print ""
              inserted=1
            }
            {print}
            END {if (!inserted) {print "ERROR: no version heading found to insert above" > "/dev/stderr"; exit 1}}
          ' "${DEST}" > "${DEST}.new"
          mv "${DEST}.new" "${DEST}"

      - name: Commit and open pull request
        if: steps.insert.outputs.skip != 'true'
        working-directory: archbee
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="docs/grafana-datasource-update-${TAG}"
          git checkout -b "${BRANCH}"
          git add "${DESTINATION_MARKDOWN}"

          if git diff --cached --quiet; then
            echo "Changelog in ${ARCHBEE_REPO} already up to date; nothing to sync"
            exit 0
          fi

          git commit -m "${PRODUCT} docs update for ${TAG}"
          # Force push so a workflow re-run updates the branch from a previous run
          git push --force origin "${BRANCH}"

          response=$(mktemp)
          status=$(curl --silent --write-out "%{http_code}" --output "${response}" -X POST \
            -H "Authorization: token ${ARCHBEE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${ARCHBEE_REPO}/pulls" \
            -d "{
              \"title\": \"${PRODUCT} docs update for ${TAG}\",
              \"body\": \"This PR automatically updates the changelog documentation for version ${TAG}.\\n\\nGenerated by the Factry release pipeline.\",
              \"head\": \"${BRANCH}\",
              \"base\": \"${ARCHBEE_BRANCH}\"
            }")

          if [ "${status#2}" != "${status}" ]; then
            echo "PR created for branch ${BRANCH}"
          elif [ "${status}" = "422" ] && grep -q "already exists" "${response}"; then
            echo "PR for branch ${BRANCH} already exists"
          else
            echo "ERROR: PR creation failed with status ${status}"
            cat "${response}"
            exit 1
          fi
