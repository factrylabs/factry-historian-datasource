name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    outputs:
      plugin-id: ${{ steps.metadata.outputs.plugin-id }}
      plugin-version: ${{ steps.metadata.outputs.plugin-version }}
      has-e2e: ${{ steps.check-for-e2e.outputs.has-e2e }}
      has-backend: ${{ steps.check-for-backend.outputs.has-backend }}
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      # persist-credentials: false everywhere in this repo. No workflow pushes
      # over git, so nothing needs GITHUB_TOKEN left behind in .git/config where
      # any later step or third-party action could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      - name: Check types
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm run test:coverage

      - name: Extract coverage percentage
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            PCT=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          else
            PCT=0
          fi
          echo "pct=$PCT" >> $GITHUB_OUTPUT

      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@d1a95e365f7f60e1438b5b36198b8c23e9ea4d59
        with:
          coverage-summary-path: ./coverage/coverage-summary.json

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.COVERAGE_GIST_ID != ''
        uses: Schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: factry-historian-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.pct }}%
          valColorRange: ${{ steps.coverage.outputs.pct }}
          maxColorRange: 100
          minColorRange: 0
      - name: Build frontend
        run: pnpm run build

      - name: Check for backend
        id: check-for-backend
        run: |
          if [ -f "Magefile.go" ]
          then
            echo "has-backend=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go environment
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: golangci-lint
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          only-new-issues: true

      - name: gosec
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: securego/gosec@bb17e422fc34bf4c0a2e5cab9d07dc45a68c040c # v2.24.7
        # This is a Docker action, so it uses the Go inside its own image rather
        # than the one Setup Go installed. That image is built on golang:1.26-alpine,
        # which sets GOTOOLCHAIN=local, so gosec fails to load any package when
        # go.mod requires a patch newer than the image happens to carry. Letting it
        # resolve the toolchain keeps this independent of the image's Go version.
        env:
          GOTOOLCHAIN: auto
        with:
          args: ./...

      - name: Test backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3
        with:
          version: latest
          args: coverage

      - name: Install Mage
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3
        with:
          version: latest
          install-only: true

      - name: Build backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        run: mage buildAll

      - name: Validate plugin
        run: |
          make validate

      - name: Check for E2E
        id: check-for-e2e
        run: |
          if [ -f "playwright.config.ts" ]
          then
            echo "has-e2e=true" >> $GITHUB_OUTPUT
          fi

      - name: Sign plugin
        run: pnpm run sign
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}

      - name: Get plugin metadata
        id: metadata
        run: |
          sudo apt-get install jq

          export GRAFANA_PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          export GRAFANA_PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          export GRAFANA_PLUGIN_ARTIFACT=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip

          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> $GITHUB_OUTPUT
          echo "plugin-version=${GRAFANA_PLUGIN_VERSION}" >> $GITHUB_OUTPUT
          echo "archive=${GRAFANA_PLUGIN_ARTIFACT}" >> $GITHUB_OUTPUT

      - name: Package plugin
        id: package-plugin
        run: |
          # "make validate" above builds a plugin-id/ copy of dist to zip. It is
          # still there, so a plain mv would move dist *into* it and ship the
          # plugin twice, with the nested copy missing its +x bit.
          rm -rf ${{ steps.metadata.outputs.plugin-id }}
          mv dist ${{ steps.metadata.outputs.plugin-id }}
          zip ${{ steps.metadata.outputs.archive }} ${{ steps.metadata.outputs.plugin-id }} -r

      - name: Archive Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.plugin-id }}-${{ steps.metadata.outputs.plugin-version }}
          path: ${{ steps.metadata.outputs.plugin-id }}
          retention-days: 5

  resolve-versions:
    name: Resolve e2e images
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: build
    if: ${{ needs.build.outputs.has-e2e == 'true' }}
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve Grafana E2E versions
        id: resolve-versions
        # Pinned to a commit rather than @main: this is a third-party action and
        # a moving ref would run whatever upstream lands. Pinning the action does
        # not freeze the matrix, which it resolves from Grafana's API at runtime.
        uses: grafana/plugin-actions/e2e-version@1dd6eaef23956f8e83831ce4ab4b159e0723e0c1 # main @ 2026-08-06

  playwright-tests:
    needs: [resolve-versions, build]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{fromJson(needs.resolve-versions.outputs.matrix)}}
    name: e2e test ${{ matrix.GRAFANA_IMAGE.name }}@${{ matrix.GRAFANA_IMAGE.VERSION }}
    runs-on: ubuntu-latest
    # Nightly is deliberately non-blocking. It tracks Grafana main, so a UI
    # change there breaks the shared @grafana/plugin-e2e fixtures (a renamed
    # data-testid behind panelEditPage, say) before a release of that library
    # exists to match. Gating on it would mean every such change turns this
    # repo red for something it neither caused nor can fix, which is how a red
    # pipeline stops meaning anything. It still runs, so the breakage is
    # visible as an early warning; it just does not block. Every released
    # Grafana version in the matrix does block, and those are the ones the
    # plugin claims to support.
    continue-on-error: ${{ matrix.GRAFANA_IMAGE.VERSION == 'nightly' }}
    steps:
      # Full checkout: docker-compose.e2e.yaml builds the mock Historian from
      # source (needs go.mod, pkg/, tests/), so a sparse checkout is not enough.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Sets up Node and pnpm and installs dependencies (same as build).
      - uses: ./.github/actions/pnpm

      - name: Download plugin
        if: needs.build.outputs.has-backend == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          name: ${{ needs.build.outputs.plugin-id }}-${{ needs.build.outputs.plugin-version }}

      - name: Execute permissions on binary
        if: needs.build.outputs.has-backend == 'true'
        run: |
          chmod +x ./dist/gpx_factry-historian-datasource_linux_amd64

      - name: Start Grafana and mock Historian
        run: |
          DEVELOPMENT=false GRAFANA_VERSION=${{ matrix.GRAFANA_IMAGE.VERSION }} GRAFANA_IMAGE=${{ matrix.GRAFANA_IMAGE.NAME }} docker compose -f docker-compose.yaml -f docker-compose.e2e.yaml up -d --build

      - name: Wait for Grafana to start
        uses: nev7n/wait_for_response@7fef3c1a6e8939d0b09062f14fec50d3c5d15fa1 # v1
        with:
          # docker-compose publishes Grafana on host port 3001 (-> 3000).
          url: 'http://localhost:3001/'
          responseCode: 200
          timeout: 60000
          interval: 500

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        id: run-tests
        run: pnpm run e2e

      - name: Docker logs
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        run: |
          docker logs factry-historian-datasource >& grafana-server.log
          # The mock logs every request it served, which shows at a glance
          # which calls the datasource made (or failed to make).
          docker logs factry-historian-mock >& mockhistorian.log

      - name: Stop grafana docker
        run: docker compose -f docker-compose.yaml -f docker-compose.e2e.yaml down

      - name: Upload server log
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        with:
          name: ${{ matrix.GRAFANA_IMAGE.NAME }}-v${{ matrix.GRAFANA_IMAGE.VERSION }}-${{github.run_id}}-server-log
          path: |
            grafana-server.log
            mockhistorian.log
          retention-days: 5

      # If your repository is public, uploading the Playwright report will make it public on the Internet.
      # Beware not to expose sensitive information.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        with:
          name: playwright-report-${{ matrix.GRAFANA_IMAGE.NAME }}-v${{ matrix.GRAFANA_IMAGE.VERSION }}-${{github.run_id}}
          path: playwright-report/
          retention-days: 5
